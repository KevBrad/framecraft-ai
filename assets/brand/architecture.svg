<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><rect width="1440" height="600" fill="#111a25"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#f6f3eb">Framecraft processing architecture</text><rect x="60" y="140" width="194" height="176" rx="8" fill="#1b2b37"/><text x="77" y="177" font-family="Arial,sans-serif" font-size="17" fill="#62d7be">01</text><text x="77" y="222" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f6f3eb">Authorized intake</text><text x="77" y="274" font-family="Arial,sans-serif" font-size="13" fill="#b2bfca">File / HTTPS / approved source</text><path d="M258 226h23" stroke="#62d7be" stroke-width="2"/><rect x="286" y="140" width="194" height="176" rx="8" fill="#1b2b37"/><text x="303" y="177" font-family="Arial,sans-serif" font-size="17" fill="#62d7be">02</text><text x="303" y="222" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f6f3eb">Bounded worker</text><text x="303" y="274" font-family="Arial,sans-serif" font-size="13" fill="#b2bfca">Process gate / checkpoints</text><path d="M484 226h23" stroke="#62d7be" stroke-width="2"/><rect x="512" y="140" width="194" height="176" rx="8" fill="#1b2b37"/><text x="529" y="177" font-family="Arial,sans-serif" font-size="17" fill="#62d7be">03</text><text x="529" y="222" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f6f3eb">Speech words</text><text x="529" y="274" font-family="Arial,sans-serif" font-size="13" fill="#b2bfca">Whisper CPU int8</text><path d="M710 226h23" stroke="#62d7be" stroke-width="2"/><rect x="738" y="140" width="194" height="176" rx="8" fill="#1b2b37"/><text x="755" y="177" font-family="Arial,sans-serif" font-size="17" fill="#62d7be">04</text><text x="755" y="222" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f6f3eb">Editorial selection</text><text x="755" y="274" font-family="Arial,sans-serif" font-size="13" fill="#b2bfca">Extractive context / ranking</text><path d="M936 226h23" stroke="#62d7be" stroke-width="2"/><rect x="964" y="140" width="194" height="176" rx="8" fill="#1b2b37"/><text x="981" y="177" font-family="Arial,sans-serif" font-size="17" fill="#62d7be">05</text><text x="981" y="222" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f6f3eb">Visual edit</text><text x="981" y="274" font-family="Arial,sans-serif" font-size="13" fill="#b2bfca">Captions / scene framing</text><path d="M1162 226h23" stroke="#62d7be" stroke-width="2"/><rect x="1190" y="140" width="194" height="176" rx="8" fill="#1b2b37"/><text x="1207" y="177" font-family="Arial,sans-serif" font-size="17" fill="#62d7be">06</text><text x="1207" y="222" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f6f3eb">Real export</text><text x="1207" y="274" font-family="Arial,sans-serif" font-size="13" fill="#b2bfca">FFmpeg / libass / ffprobe</text><path d="M60 386h1320" stroke="#354251"/><g fill="#f6f3eb" font-family="Arial,sans-serif" font-size="24"><text x="60" y="451">React + TypeScript editor</text><text x="524" y="451">FastAPI + durable queues</text><text x="1013" y="451">SQLite WAL + local files</text></g><g fill="#9babb8" font-family="Arial,sans-serif" font-size="17"><text x="60" y="491">Review, edit, save and preview</text><text x="524" y="491">Separate import and analysis consumers</text><text x="1013" y="491">Sources, edits and export history</text></g><text x="60" y="560" fill="#9babb8" font-family="Arial,sans-serif" font-size="16">Single-user local application. No hosted AI, account system or cloud queue is implied.</text></svg>