name: Optional media integration

# Explicit dispatch keeps ASR weights and actual video work out of each PR run.
# This job downloads only documented public test fixtures, never user videos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-media:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Install external media executables
        run: choco install ffmpeg --no-progress -y
      - name: Prepare documented public-domain fixtures
        run: |
          python scripts/prepare_fixture.py
          python scripts/prepare_face_fixture.py
      - name: Run actual ASR, API, rendering and resource tests
        run: python -m pytest backend tests -q
