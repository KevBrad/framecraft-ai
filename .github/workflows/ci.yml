name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  backend:
    name: Windows logic, intake and security regressions
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run logic and transport tests without model downloads or private media
        run: >-
          python -m pytest -q
          backend/test_pipeline.py::HighlightTests
          backend/test_resources.py::DiskBudgetTests
          tests/test_chunked_transcription.py
          tests/test_drive.py
          tests/test_ingestion.py
          tests/test_import_transport.py
          tests/test_director.py
          tests/test_editorial.py
          -k "not real_decoded_motion_fixture and not retained_legacy_style_can_render_independent_opening_hook"
